# Static deployment for GitHub Pages on the custom domain
# https://madar-manteghi.danialrashidi.ir (root serve, no sub-path).
#
# Node 22 is the version this site is developed and verified against.
# Pages runs `npm ci` + `npm run build` from the repository root and publishes
# the `dist/` artifact. The origin and root base path are fixed below so no
# repository variables are needed. The `public/CNAME` file carries the custom
# hostname into `dist/CNAME` so Pages routes it.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Custom domain serves at the root: no base-path prefix, fixed origin.
          # No repository variables required.
          BASE_PATH: ""
          SITE_URL: https://madar-manteghi.danialrashidi.ir
        run: npm run build

      - name: Validate built output
        run: node scripts/validate-content.mjs --links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4